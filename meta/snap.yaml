name: mail
summary: Mail server
description: Mail, contacts and calendars with a web interface, compatible with popular mail apps
grade: stable

apps:
  stalwart:
    command: bin/service.stalwart.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s
    before: [bulwark, nginx, migrate]
  bulwark:
    user: mail
    command: bin/service.bulwark.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s
    after: [stalwart]
    before: [nginx]
  nginx:
    user: mail
    command: bin/service.nginx.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s
    after: [bulwark]
  migrate:
    user: mail
    command: bin/cli migrate
    daemon: simple
    restart-condition: on-failure
    restart-delay: 10s
    after: [stalwart]

  cli:
    command: bin/cli

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  mail-relay-change:
    command: bin/cli mail-relay-change

  certificate-change:
    command: bin/cli certificate-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start
