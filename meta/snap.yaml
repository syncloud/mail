apps:
  postfix:
    command: bin/service.postfix.sh
    daemon: forking
    plugs:
    - network
    - network-bind
    restart-condition: always
    before: [php-fpm]
  dovecot:
    command: bin/service.dovecot.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    before: [php-fpm]
  postgresql:
    user: mail
    command: bin/service.postgresql.sh
    daemon: forking
    plugs:
    - network
    - network-bind
    restart-condition: always
    before: [php-fpm]
  php-fpm:
    user: mail
    command: bin/service.php-fpm.sh
    daemon: forking
    plugs:
    - network
    - network-bind
    restart-condition: always
    after: [postgresql]
    before: [nginx]
  opendkim:
    user: mail
    command: bin/service.opendkim.sh
    daemon: forking
    plugs:
    - network
    - network-bind
    restart-condition: always
    after: [postgresql]
    before: [nginx]
  nginx:
    command: bin/service.nginx.sh
    user: mail
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  mail-relay-change:
    command: bin/cli mail-relay-change

  certificate-change:
    command: bin/cli certificate-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

confinement: strict
description: Mail with Web interface and compatible with popular mail apps
grade: stable
name: mail
summary: Mail server
