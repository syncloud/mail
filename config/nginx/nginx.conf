worker_processes 4;
pid {{ .DataDir }}/nginx/nginx.pid;
error_log syslog:server=unix:/dev/log warn;

daemon off;

events {
    worker_connections  1024;
}

http {

    include {{ .AppDir }}/nginx/etc/nginx/mime.types;

    client_body_temp_path {{ .DataDir }}/nginx/client_body_temp;
    proxy_temp_path {{ .DataDir }}/nginx/proxy_temp;
    fastcgi_temp_path {{ .DataDir }}/nginx/fastcgi_temp;
    uwsgi_temp_path {{ .DataDir }}/nginx/puwsgi_temp;
    scgi_temp_path {{ .DataDir }}/nginx/scgi_temp;

    upstream stalwart {
        server unix:{{ .DataDir }}/stalwart.sock;
    }

    upstream bulwark {
        server unix:{{ .DataDir }}/bulwark.sock;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_real_ip $client_address {
        default     $http_x_real_ip;
        ''          '';
        '127.0.0.1' '';
        '::1'       '';
    }

    map $arg_client_id $login_upstream {
        default http://stalwart;
        ''      http://bulwark;
    }

    server {
        listen unix:{{ .CommonDir }}/web.socket;
        server_name localhost;

        access_log syslog:server=unix:/dev/log;
        client_max_body_size 100M;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_address;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;

        location /jmap {
            proxy_pass http://stalwart;
        }

        location /.well-known/ {
            proxy_pass http://stalwart;
        }

        location /dav/ {
            proxy_pass http://stalwart;
        }

        location ~ ^/stalwart(/|$) {
            proxy_pass http://stalwart;
        }

        location = /mail/config-v1.1.xml {
            proxy_pass http://stalwart;
        }

        location ~* ^/autodiscover/ {
            proxy_pass http://stalwart;
        }

        location ~ ^/auth/(device|token|revoke|introspect|userinfo|register|logout|jwks\.json)$ {
            proxy_pass http://stalwart;
        }

        location = /api/auth {
            proxy_pass http://stalwart;
        }

        location = /api/auth/client {
            proxy_pass http://stalwart;
        }

        location = /api/account {
            proxy_pass http://stalwart;
        }

        location ~ ^/api/(discover|schema|token|live)(/|$) {
            proxy_pass http://stalwart;
        }

        location = /api/calendar/rsvp {
            proxy_pass http://stalwart;
        }

        location = /calendar/rsvp {
            proxy_pass http://stalwart;
        }

        location = /login {
            proxy_pass $login_upstream;
        }

        location / {
            proxy_pass http://bulwark;
        }
    }
}
